name: Verify LocalCSV
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code -- public/js/main.js
      - run: npm run test:static
      - run: npm test
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - run: node tests/localcsv-pointer-finalization-browser.test.mjs
      - run: node tests/localcsv-yield-browser.test.mjs
      - run: node tests/localcsv-continuous-search-browser.test.mjs
        env:
          LOCALCSV_SEARCH_RUNS: '1'
      - run: node tests/localcsv-selection-browser.test.mjs
        env:
          LOCALCSV_SELECTION_ROWS: '12000'
          LOCALCSV_SELECTION_RUNS: '1'
      - run: |
          for engine in chromium firefox webkit; do
            LOCALCSV_COPY_ENGINE="$engine" node tests/localcsv-copy-browser.test.mjs
          done
        env:
          LOCALCSV_COPY_ROWS: '500'
          LOCALCSV_COPY_RUNS: '1'
          LOCALCSV_COPY_SPECIAL: '1'
